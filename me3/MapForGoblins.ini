show_merchant_bell_bearings = true
; Heil-/Buff-Verbrauchsgüter (Boli, geräuchertes Fleisch, Lebern)
show_consumables = true
; Waffenfette
show_greases = true
; Hilfsobjekte (Regenbogenstein, Glühstein, Seife, weiche Baumwolle)
show_utilities = true
; Werte-Verstärker (Sternenlichtsplitter, Opferzweig, Segen von Marika)
show_stat_boosts = true
