show_crafting_materials = true
; Tallilien (Gräber-/Geistertallilie [1-9]) - Verbesserungsmaterial für Geisterasche
show_gloveworts = true
; Goldene Runen [4000+], Helden-/Numen-/Fürsten-/Schattenreich-Runen
show_golden_runes = true
; Goldene Runen [200-3000], Gebrochene Runen
show_golden_runes_low = true
; Große Tallilien (Große Gräbertallilie, Große Geistertallilie)
