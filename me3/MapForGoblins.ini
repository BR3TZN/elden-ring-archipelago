[World]
; Boss-Markierungen (Feldbosse, Verliesbosse)
show_bosses = true
; Orte der Gnade
show_graces = true
; Orte feindlicher NPC-Invasoren
show_hostile_npc = true
; Starke Gegner, die nach dem Tod nicht wiederkehren (Skarabäen, Feld-Minibosse, einige NPCs)
show_strong_enemies = true
; Orte von Wichtstatuen (Nebeltore mit Steinschwertschlüssel)
show_imp_statues = true
; Orte von Gemälden
show_paintings = true
; Orte von Geisterquellen (Pferdesprünge)
show_spirit_springs = true
; Pfähle Marikas (Wiederbelebungspunkte)
show_stakes_of_marika = true
; Orte von Beschwörungsbecken (Märtyrer-Abbild)
show_summoning_pools = true
; Interaktive Weltobjekte & Rätsel: blaue Siegelrätsel (schalten versteckte
; Keller frei), Feuer-Entzünden-Interaktionen (Sellia-Kelche, Statuen der Schneestadt, Laternen
; des Siofra-Flusses) und Wegstatuen der Heldengräber.
show_interactables = true
; Orte von Weltkartenfragmenten
show_world_maps = true
; Kartenfragment-Marker immer anzeigen, auch wenn die Fragment-Sperre aktiv ist (damit du ein Fragment finden kannst, bevor du es besitzt).
show_world_maps_ignore_fragments = true
; Boss-/Invasor-/Falken-Markierungen nach dem Besiegen ausblenden (false = stattdessen grünes Häkchen anzeigen)
hide_killed_bosses = false

; Optionen für den Betrieb neben anderen Mods, die die Gegenstandsplatzierung ändern.
[Compatibility]
; Blendet Beute-Markierungen anhand des Aufnahme-Flags der geladenen Regulation aus, damit sie
; unter dem Item-/Enemy-Randomizer oder anderen Regulation-Mods korrekt verschwinden.
live_loot_flags = true
; Benennt jede Beute-Markierung mit dem Gegenstand um, den ihr Lot aktuell gibt, damit die Namen zum
; Randomizer passen. Verbraucht mehr Speicher (kopiert Gegenstandsnamen in die Namenstabelle der Karte).
live_loot_labels = true
; Gibt jeder Beute-Markierung das Symbol und die Kategorie des Gegenstands, den ihr Lot aktuell
; gibt, damit Symbole und show_*-Schalter zum Randomizer passen.
live_loot_icons = true
; Spoilerfrei: jede Beute-Markierung zeigt ein graues "?" und eine allgemeine Bezeichnung statt
; des echten Gegenstands. Überschreibt live_loot_labels/icons; Markierungen verschwinden weiterhin beim Aufnehmen.
anonymous_loot = false

; Das MENÜ der Mod und die Taste, die es öffnet. toggle_key (Tastatur) /
; toggle_gamepad_combo (Controller) ÖFFNEN das Menü, wenn menu_enabled an ist, sonst
; schalten sie ALLE Kartensymbole ein/aus. Welches Menü sich öffnet, legt
; menu_render_mode fest. Tastennamen: F1-F24, A-Z, 0-9, Space, Escape, Tab, Enter,
; Backspace, Home, End, PageUp, PageDown, Insert, Delete, Pfeiltasten.
[Menu & Hotkeys]
; Das Menü der Mod auf der Taste unten. Ist dies aus, schalten dieselben Tasten ALLE
; Kartensymbole ein/aus und es öffnet sich kein Menü - das ist auch die Einstellung
; bei einem DX-Overlay-Konflikt (Steam-Overlay/RTSS/GeForce Experience) oder
; Treiberproblemen mit dem Overlay-Menü.
menu_enabled = true
; WELCHES Menü die Taste öffnet: native (das Menü, das das Spiel selbst zeichnet) oder
; imgui (das separate Overlay-Fenster). Nur hier änderbar - ein Menü kann nicht den
; Schalter enthalten, der über seine Existenz entscheidet. Neustart erforderlich.
menu_render_mode = imgui
; Sprache von allem, was dieser Mod schreibt: spieleigenes Menü, Overlay-Menü,
; Karten-Tooltip und die Kommentare in dieser Datei. auto folgt der Steam-Spielsprache;
; unbekannte Sprachen fallen auf Englisch zurück.
; Werte: auto, english, schinese, tchinese, korean, russian, german, french, spanish.
; Gegenstands- und Ortsnamen auf den Markierungen stammen aus dem Spiel selbst und
; bleiben immer in dessen Sprache, denn das Spiel lädt nur diese eine. Das spieleigene
; Menü wird mit der SCHRIFT DES SPIELS gezeichnet: Chinesisch oder Koreanisch in einer
; europäischen Fassung erscheint dort als leere Kästchen, das Overlay bringt eine
; eigene Schrift mit und zeigt sie an. Gegnernamen auf den Markierungen und diese
; Overlay-Schrift entstehen beim Laden des Spiels und folgen einer Änderung erst nach
; einem Neustart.
ui_language = auto
; Overlay menu text size multiplier (1.0 = default). Raise on 4K / high-DPI
; screens if the menu text is too small. Also adjustable live from the slider at
; the top of the overlay's Settings tab.
overlay_font_scale = 1.2
; Overlay menu panel opacity, 0.3 to 1.0 (1.0 = solid). Lower it to see more
; of the map behind the menu. Also adjustable live from a slider in the Settings tab.
overlay_opacity = 1.0
; Overlay menu horizontal CENTER, fraction of screen width (0.5 = centered). Auto-saved.
overlay_window_x = 0.5
; Overlay menu TOP edge, fraction of screen height (0.0 = top). Auto-saved.
overlay_window_y = 0.03
; Overlay menu window width in pixels (auto-saved, clamped to screen).
overlay_window_w = 780
; Overlay menu window height in pixels (auto-saved, clamped to screen).
overlay_window_h = 900
; Aktiviert toggle_key / toggle_gamepad_combo, um ALLE Kartensymbole an/aus zu schalten, wenn
; das Overlay DEAKTIVIERT ist. (Wenn das Overlay aktiviert ist, öffnen sie es stattdessen.)
enable_toggle_hotkey = true
; Tastatur-Toggle: ÖFFNET das Konfigurations-Overlay, wenn menu_enabled aktiv ist, oder
; schaltet ALLE Kartensymbole an/aus, wenn das Overlay deaktiviert ist. Standard: F10.
toggle_key = F10
; Gamepad-Umschalter, gleiche Rolle wie toggle_key: öffnet das Overlay oder schaltet
; ALLE Kartensymbole ein/aus, wenn das Overlay deaktiviert ist. Im Menü drücken Sie
; einfach die gewünschten Tasten. Beim Bearbeiten dieser Datei werden Namen mit '+'
; verbunden (A, B, X, Y, LB, RB, L3, R3, BACK, START, UP, DOWN, LEFT, RIGHT).
toggle_gamepad_combo = Y+R3
; Zeige mit dem Cursor auf einen Marker auf der Weltkarte und drücke die Ausblenden-Taste. Ausgeblendete Marker bleiben erhalten und lassen sich im Tab 'Ausgeblendet' wiederherstellen.
enable_manual_hide = true
; Taste, die den Kartenmarker unter dem Cursor ausblendet.
hide_marker_key = Delete
; Gamepad-Knopf zum Ausblenden des Markers unter dem Cursor (wie die Ausblenden-Taste).
hide_marker_gamepad = none
; Gegenstandssuche: nur noch nicht eingesammelte Marker auflisten. Aus = alles auflisten, Eingesammeltes wird markiert.
search_hide_collected = true
; Zeigt bei offener Karte LINKS ein kleines Feld damit, wie weit die Markierung unter
; dem Zeiger über oder unter Ihnen liegt. Der Name wird nicht wiederholt - das
; eigene Popup des Spiels zeigt ihn bereits.
hover_info = true

; Diagnose, angezeigt im Debug-Tab des Overlays.
[Debug]
; Aktiviert ausführliches Debug-Protokoll (Speicheradressen, Param-Details, FMG-Interna)
debug_logging = false
; Hauptschalter für den Markierungsexport-Hotkey
enable_marker_dump = false
; Taste zum Exportieren dekodierter Markierungen nach logs/MapForGoblins_markers.log. Standard: F9.
marker_dump_key = F9
