; MapForGoblins-Konfiguration. Automatisch aus dem im Code hinterlegten Schema erzeugt;
; die DLL synchronisiert diese Datei beim Start neu (fügt neue Schlüssel hinzu, kommentiert entfernte aus).

[Goblin]
; Erfordert das Entdecken des Kartenfragments, bevor Symbole in diesem Gebiet angezeigt werden
require_map_fragments = true
; Marker der Karte, auf der du dich befindest, werden größer gezeichnet; Marker, die nur nahe wirken (ein Verlies unter dir oder die Oberfläche darüber), kleiner. Es wird nie etwas ausgeblendet.
location_emphasis = true
; Wo Marker-Tooltip und Fokusbanner auf dem Kartenbildschirm sitzen. 100 ist die vorgesehene Ecke, 0 die Mitte. Ueber 100 rueckt sie weiter nach links. Wirkt sofort.
map_panel_offset_percent = 100
; Größe der Marker des Ortes, an dem du dich befindest (1.0 = unverändert).
location_emphasis_own_scale = 1.05
; Größe der Marker aller anderen Orte (1.0 = unverändert).
location_emphasis_other_scale = 0.95
; Wie stark die Marker anderer Orte abgedunkelt werden (1.0 = gar nicht, 0.2 = am stärksten). Sie bleiben sichtbar und anklickbar, nur zurückhaltender.
location_emphasis_other_fade = 0.75
; Wie stark die Marker anderer Orte zusätzlich zum Abdunkeln ins Kalte gezogen werden (0.0 = Farbe unverändert, 1.0 = am stärksten).
location_emphasis_other_cool = 0.90

[Equipment]
